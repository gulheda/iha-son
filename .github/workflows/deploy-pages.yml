name: Deploy to GitHub Pages

# Publishes the site to GitHub Pages so it has a real public HTTPS URL
# (needed for the camera feature to work when the link is shared).

on:
  push:
    branches: ["claude/find-your-sunshine-site-4ysgh9"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
