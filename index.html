<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#03050A" />
  <title>Find Your Sunshine</title>
  <meta name="description" content="Karanlık bir evrende saklı bir ışık — senin için." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500&family=Caveat:wght@600&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="is-loading" data-scene="intro">

  <!-- The universe renders here. -->
  <canvas id="scene" aria-label="Yıldızlarla dolu bir evren"></canvas>

  <!-- A floating name label for the planet under the pointer. -->
  <div class="planet-label" id="planetLabel" aria-hidden="true"></div>

  <!-- Sound toggle — always visible. -->
  <button class="sound-toggle" id="soundToggle" type="button"
          aria-pressed="false" aria-label="Sesi aç">
    <span class="sound-toggle__waves" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="sound-toggle__line" aria-hidden="true"></span>
  </button>

  <!-- Discovery progress — a small row of stars, one per chapter. -->
  <div class="progress" id="progress" role="progressbar"
       aria-label="Keşfedilen anılar" aria-valuemin="0" aria-valuenow="0"></div>

  <!-- Gentle travelling hint. -->
  <p class="travel-hint" id="travelHint" role="status" aria-live="polite"></p>

  <!-- ============================ INTRO ================================= -->
  <section class="intro" id="intro" aria-label="Başlangıç">
    <button class="intro__star" id="introStar" type="button" aria-label="Yolculuğa başla"></button>
    <h1 class="intro__title" id="introTitle"></h1>
    <p class="intro__hint" id="introHint"></p>
  </section>

  <!-- ============================ CHAPTER PANEL ========================= -->
  <div class="panel" id="panel" role="dialog" aria-modal="true"
       aria-labelledby="panelName" aria-hidden="true">
    <button class="panel__close" id="panelClose" type="button" aria-label="Geri dön">‹&nbsp;Geri</button>
    <figure class="panel__figure" id="panelFigure">
      <img class="panel__img" id="panelImg" alt="" />
    </figure>
    <div class="panel__body">
      <h2 class="panel__name" id="panelName"></h2>
      <p class="panel__text" id="panelText"></p>
      <button class="btn panel__letterBtn" id="panelLetterBtn" type="button" hidden>Mektubu aç</button>
    </div>
  </div>

  <!-- ============================ LETTER ================================ -->
  <div class="letter" id="letter" role="dialog" aria-modal="true"
       aria-labelledby="letterHeading" aria-hidden="true">
    <div class="letter__backdrop" data-close></div>
    <div class="letter__paper" role="document">
      <button class="letter__close" id="letterClose" type="button" aria-label="Mektubu kapat" data-close>&times;</button>
      <h2 class="letter__heading" id="letterHeading">Sana bir mektup</h2>
      <div class="letter__body" id="letterBody"></div>
      <button class="btn letter__done" id="letterDone" type="button">Kapat</button>
    </div>
  </div>

  <!-- ============================ FINALE =============================== -->
  <section class="finale" id="finale" aria-hidden="true">
    <img class="finale__photo" id="finalePhoto" alt="" />
    <div class="finale__lines" id="finaleLines"></div>

    <div class="finale__wishWrap" id="wishWrap" hidden>
      <button class="btn btn--gold finale__wishBtn" id="wishBtn" type="button"></button>
      <form class="wish" id="wishForm" hidden>
        <label class="wish__label" id="wishLabel" for="wishInput"></label>
        <input class="wish__input" id="wishInput" type="text" maxlength="120" autocomplete="off" />
        <button class="btn btn--gold" id="wishSend" type="submit"></button>
      </form>
    </div>

    <div class="finale__birthday" id="birthday" hidden>
      <h1 class="finale__bTitle" id="bTitle"></h1>
      <p class="finale__bSub" id="bSub"></p>
    </div>
  </section>

  <!-- Hidden-star message. -->
  <p class="secret-toast" id="secretToast" role="status" aria-live="polite" aria-hidden="true"></p>

  <!-- three.js (local copy → works offline / on Pages with no CDN) -->
  <script src="js/vendor/three.min.js"></script>
  <!-- content → audio → engine -->
  <script src="js/content.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/universe.js"></script>
</body>
</html>
